
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CV | السيرة الذاتية الذكية</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
          rel="stylesheet">

    <!-- ملف التنسيق الخاص بالمشروع -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                Smart CV
            </a>
            <span class="text-light">سيرتك الذاتية تبدأ هنا</span>
        </div>
    </nav>

    <main class="container auth-container">
        <div class="row justify-content-center align-items-center">
            <div class="col-lg-5 col-md-7">

                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="logo-icon">CV</div>
                        <h1 class="h3 fw-bold mt-3">مرحبًا بك</h1>
                        <p class="text-secondary">
                            أنشئ سيرتك الذاتية بطريقة سهلة واحترافية
                        </p>
                    </div>

                    <div class="d-flex gap-2 mb-4">
                        <button class="btn tab-btn active w-50"
                                id="loginTab" type="button">
                            تسجيل الدخول
                        </button>
                        <button class="btn tab-btn w-50"
                                id="registerTab" type="button">
                            إنشاء حساب
                        </button>
                    </div>

                    <!-- نموذج تسجيل الدخول -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control"
                                   placeholder="name@example.com" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control"
                                   placeholder="أدخل كلمة المرور" required>
                        </div>

                        <div class="text-end mb-3">
                            <a href="#" id="forgotLink" class="small-link">
                                نسيت كلمة المرور؟
                            </a>
                        </div>

                        <button class="btn btn-primary w-100 main-btn"
                                type="submit">
                            تسجيل الدخول
                        </button>
                    </form>

                    <!-- نموذج إنشاء حساب -->
                    <form id="registerForm" class="d-none">
                        <div class="mb-3">
                            <label class="form-label">الاسم الكامل</label>
                            <input type="text" class="form-control"
                                   placeholder="أدخل اسمك" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control"
                                   placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control"
                                   minlength="8" placeholder="8 أحرف على الأقل"
                                   required>
                        </div>

                        <button class="btn btn-primary w-100 main-btn"
                                type="submit">
                            إنشاء الحساب
                        </button>
                    </form>

                    <!-- نموذج استعادة كلمة المرور -->
                    <form id="forgotForm" class="d-none">
                        <p class="text-secondary">
                            أدخل بريدك الإلكتروني لاستعادة كلمة المرور.
                        </p>

                        <div class="mb-3">
                            <label class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control"
                                   placeholder="name@example.com" required>
                        </div>

                        <button class="btn btn-primary w-100 main-btn"
                                type="submit">
                            استعادة كلمة المرور
                        </button>

                        <button type="button" id="backToLogin"
                                class="btn btn-outline-light w-100 mt-2">
                            العودة لتسجيل الدخول
                        </button>
                    </form>

                    <div id="message" class="mt-3 small text-center"
                         role="status"></div>

                    <p class="text-center text-secondary small mt-4 mb-0">
                        مشروع تعليمي لإنشاء السيرة الذاتية وفحص توافقها مع ATS
                    </p>
                </div>

            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
