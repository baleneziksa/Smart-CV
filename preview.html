
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة السيرة الذاتية | Smart CV</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="preview.css">

</head>
<body>

    <nav class="navbar navbar-dark no-print">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand fw-bold">Smart CV</a>
            <a href="builder.html" class="btn btn-outline-light">تعديل السيرة</a>
        </div>
    </nav>
    

    <main class="container py-5">

        
<!-- الوصف الوظيفي لتحليل ATS -->
<div class="row justify-content-center mb-4 no-print">
    <div class="col-md-8">
        <label for="jobDescription" class="form-label fw-bold">
            الوصف الوظيفي المستهدف
        </label>
        <textarea
            id="jobDescription"
            class="form-control"
            rows="5"
            placeholder="مثال: مطلوب مطور ويب يجيد PHP وJavaScript وSQL ولديه خبرة في HTML وCSS"
        ></textarea>
        <p class="text-secondary small mt-2">
            اكتب متطلبات الوظيفة لمقارنة الكلمات المفتاحية مع سيرتك الذاتية.
        </p>
    </div>
</div>


        <div class="text-center mb-4 no-print">
            <h1 class="fw-bold">معاينة السيرة الذاتية</h1>
            <p class="text-secondary">اختر القالب المناسب لك</p>
        </div>

        <div class="d-flex justify-content-center flex-wrap gap-3 mb-4 no-print">
            <button class="btn btn-primary template-btn" data-template="classic">
                القالب الكلاسيكي
            </button>
            <button class="btn btn-outline-light template-btn" data-template="modern">
                القالب العصري
            </button>
            <button class="btn btn-outline-light template-btn" data-template="professional">
                القالب الاحترافي
            </button>
        </div>

        <div class="text-center mb-4 no-print">
            <button id="printBtn" class="btn btn-primary main-btn px-4">
                طباعة / حفظ PDF
            </button>
            <button id="atsBtn" class="btn btn-outline-light ms-2">
                فحص ATS
            </button>
        </div>

        <div id="atsResult" class="ats-result d-none no-print mb-4"></div>

        <article id="resumePreview" class="resume-paper classic">
            <div id="resumeContent"></div>
        </article>
    </main>

    <script src="ats-checker.js"></script>
    <script src="preview.js"></script>
</body>
</html>
